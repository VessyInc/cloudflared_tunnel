name: 2 - Build and push image to ACR

# Builds the cloudflared source in ./cloudflared and pushes it to ACR as
# cloudflaredtunnel:vN (and :latest), where N is one higher than the highest
# vN tag already in the registry. The first run publishes v1.
#
# Authenticates to Azure with OIDC (workload identity federation), so no client
# secret is stored anywhere. AZURE_SPN_ID holds only the service principal's
# client ID. The job runs in the acr-push environment because the federated
# credential matches subjects of the form
# repo:VessyInc@<owner id>/cloudflared_tunnel@<repo id>:environment:*.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms, comma-separated"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  id-token: write
  contents: read

# Runs are queued, never parallel, so two runs can't claim the same version.
concurrency:
  group: acr-push-cloudflaredtunnel
  cancel-in-progress: false

env:
  AZURE_TENANT_ID: 9cdec346-9087-4758-a5a5-2144a3ed72d4
  REGISTRY: acrswcvessyinc.azurecr.io
  IMAGE_NAME: cloudflaredtunnel
  SOURCE_DIR: cloudflared
  METADATA_FILE: cloudflared-source.json

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    environment: acr-push
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Read synced cloudflared source
        id: src
        run: |
          if [ ! -f "$METADATA_FILE" ] || [ ! -f "$SOURCE_DIR/Dockerfile" ]; then
            echo "::error::No cloudflared source in this repo yet. Run the '1 - Sync cloudflared source' workflow first."
            exit 1
          fi

          # Build with the same Go and runtime base images as cloudflare's own Dockerfile.
          from_images() {
            awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' "$SOURCE_DIR/Dockerfile"
          }
          go_image=$(from_images | grep -m1 '^golang:' || true)
          base_image=$(from_images | tail -n1)
          for image in "$go_image" "$base_image"; do
            if [ -z "$image" ] || [[ "$image" == *'$'* ]]; then
              echo "::error::Could not read the builder/base images from $SOURCE_DIR/Dockerfile. Upstream may have changed its layout; update the root Dockerfile to match."
              exit 1
            fi
          done

          {
            echo "version=$(jq -r .version "$METADATA_FILE")"
            echo "commit=$(jq -r .commit "$METADATA_FILE")"
            echo "go_image=$go_image"
            echo "base_image=$base_image"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SPN_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          # Only AcrPush on the registry is needed, not access to a subscription.
          allow-no-subscriptions: true

      - name: Log in to ACR
        run: |
          # Swap the Entra ID token for an ACR refresh token, as `az acr login` does
          # internally. Going straight to the registry skips az's ARM lookup of the
          # registry, which needs a subscription and read access that AcrPush doesn't give.
          aad_token=$(az account get-access-token --query accessToken --output tsv)
          echo "::add-mask::$aad_token"

          refresh_token=$(curl -fsS -X POST "https://$REGISTRY/oauth2/exchange" \
            --data-urlencode grant_type=access_token \
            --data-urlencode "service=$REGISTRY" \
            --data-urlencode "tenant=$AZURE_TENANT_ID" \
            --data-urlencode "access_token=$aad_token" | jq -r '.refresh_token // empty') || true
          if [ -z "$refresh_token" ]; then
            echo "::error::$REGISTRY did not issue a token. Check the service principal has AcrPush on the registry."
            exit 1
          fi
          echo "::add-mask::$refresh_token"

          docker login "$REGISTRY" --username 00000000-0000-0000-0000-000000000000 --password-stdin <<<"$refresh_token"

      - name: Work out next version
        id: version
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          fi

          err="$RUNNER_TEMP/skopeo.err"
          if tags=$(skopeo list-tags --authfile "$HOME/.docker/config.json" "docker://$REGISTRY/$IMAGE_NAME" 2>"$err"); then
            last=$(jq -r '(.Tags // [])[]' <<<"$tags" | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -n1)
          elif grep -qiE 'name unknown|not known to registry|not found|404' "$err"; then
            echo "Repository $IMAGE_NAME does not exist in $REGISTRY yet."
            last=""
          else
            cat "$err" >&2
            echo "::error::Could not list existing tags of $REGISTRY/$IMAGE_NAME."
            exit 1
          fi

          next="v$(( ${last:-0} + 1 ))"
          echo "Previous version: ${last:+v}${last:-none}, publishing: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TAG: ${{ steps.version.outputs.tag }}
          CLOUDFLARED_VERSION: ${{ steps.src.outputs.version }}
          CLOUDFLARED_COMMIT: ${{ steps.src.outputs.commit }}
          GO_IMAGE: ${{ steps.src.outputs.go_image }}
          BASE_IMAGE: ${{ steps.src.outputs.base_image }}
        run: |
          docker buildx create --name cloudflared-builder --driver docker-container --use

          docker buildx build \
            --file Dockerfile \
            --platform "$PLATFORMS" \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg CLOUDFLARED_VERSION="$CLOUDFLARED_VERSION" \
            --label org.opencontainers.image.title="$IMAGE_NAME" \
            --label org.opencontainers.image.version="$TAG" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label com.cloudflare.cloudflared.version="$CLOUDFLARED_VERSION" \
            --label com.cloudflare.cloudflared.commit="$CLOUDFLARED_COMMIT" \
            --tag "$REGISTRY/$IMAGE_NAME:$TAG" \
            --tag "$REGISTRY/$IMAGE_NAME:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$SOURCE_DIR"

          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CLOUDFLARED_VERSION: ${{ steps.src.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Pushed \`$REGISTRY/$IMAGE_NAME:$TAG\`

          | | |
          |---|---|
          | Tags | \`$TAG\`, \`latest\` |
          | cloudflared version | \`$CLOUDFLARED_VERSION\` |
          | Platforms | \`$PLATFORMS\` |
          | Digest | \`$DIGEST\` |

          \`\`\`
          docker pull $REGISTRY/$IMAGE_NAME:$TAG
          \`\`\`
          EOF
